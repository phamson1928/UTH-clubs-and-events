name: Deploy Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'uth-club-backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -e

            if [ -d ~/UTH-clubs-and-events/.git ]; then
              cd ~/UTH-clubs-and-events
              git pull origin main
            else
              git clone https://github.com/phamson1928/UTH-clubs-and-events.git ~/UTH-clubs-and-events
            fi

            cd ~/UTH-clubs-and-events/uth-club-backend

            echo '=== Verify production environment ==='
            if [ ! -f .env ]; then
              echo 'Missing uth-club-backend/.env on the server.'
              exit 1
            fi

            echo '=== Rebuild & restart ==='
            docker compose up -d --build

            echo '=== Clean up old images ==='
            docker image prune -f

            echo '=== Deploy done ==='
          "
